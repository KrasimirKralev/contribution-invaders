name: Self-run

# Runs the action from this checkout on the repository owner's own graph every
# day and publishes the result to the `output` branch, as a live demo.
on:
  schedule:
    - cron: '17 6 * * *' # daily at 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'dist/**'
      - '.github/workflows/self-run.yml'

permissions:
  contents: write

# Overlapping runs would race to push the output branch.
concurrency:
  group: self-run
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render with the action in this checkout
        id: invaders
        uses: ./
        with:
          outputs: |
            output/invaders.svg
            output/invaders-dark.svg?palette=dark

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd output
          git init -q -b output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add invaders.svg invaders-dark.svg
          git commit -q -m 'chore: refresh the self-run svgs'
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
